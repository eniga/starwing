<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<iframe id="f" src="/index.html?autostart=1" style="width:100vw;height:100vh;border:0"></iframe>
<script>
let frames = 0;
(function count() { frames++; requestAnimationFrame(count); })();
setInterval(() => {
  try {
    const w = document.getElementById('f').contentWindow.__STARWING;
    console.log('PROBE rt=' + performance.now().toFixed(0) + ' fps~' + (frames/10).toFixed(1) + ' state=' + w.state + ' time=' + (w.time||0).toFixed(2) + ' level=' + w.levelIndex);
    frames = 0;
  } catch (e) { console.log('PROBE_ERR ' + e.message); }
}, 1000);
</script>
</body>
</html>
