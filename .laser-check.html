<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<iframe id="f" src="/index.html?autostart=1" style="width:100vw;height:100vh;border:0"></iframe>
<script>
// Verifies the laser fix:
//  1. pool meshes are parented to the scene (renderable)
//  2. while firing, near-white pixels (laser is toneMapped:false, clamps to white)
//     increase vs a no-fire baseline frame
const f = document.getElementById('f');
const gwin = () => f.contentWindow;

function grabFrame() {
  const canvas = f.contentDocument.querySelector('canvas');
  const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
  const w = canvas.width, h = canvas.height;
  const px = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  return px;
}
function whiteCount(px) {
  let n = 0;
  for (let i = 0; i < px.length; i += 4)
    if (px[i] > 240 && px[i + 1] > 240 && px[i + 2] > 240) n++;
  return n;
}

function waitPlay(cb) {
  const t = setInterval(() => {
    try {
      const world = gwin().__STARWING;
      if (world && world.state === 'PLAY') { clearInterval(t); cb(world); }
    } catch (e) {}
  }, 100);
}

waitPlay((world) => {
  const phase = { n: 0 };
  let baseline = null;
  const firingFrames = [];
  const orig = world.renderer.render.bind(world.renderer);
  world.renderer.render = function (...a) {
    const r = orig(...a);
    // readPixels must run synchronously after composer.render(), before
    // the browser composites and clears the drawing buffer.
    try {
      if (phase.n === 0) { baseline = whiteCount(grabFrame()); phase.n = 1; }
      else if (phase.n >= 2) { firingFrames.push(whiteCount(grabFrame())); if (firingFrames.length >= 5) phase.n = 9; }
    } catch (e) { console.log('LASER_CHECK grab_err ' + e.message); }
    return r;
  };

  // one wrapped frame for the baseline, then hold Space ~1.5s
  setTimeout(() => {
    phase.n = 2;
    gwin().dispatchEvent(new gwin().KeyboardEvent('keydown', { code: 'Space' }));
    setTimeout(() => gwin().dispatchEvent(new gwin().KeyboardEvent('keyup', { code: 'Space' })), 1500);
    setTimeout(() => {
      const active = world.projectiles.playerPool.activeCount;
      const parented = world.projectiles.playerPool.items.filter(s => s.mesh.parent === world.scene).length;
      const scene = world.scene;
      const rings = scene.children.filter(c => c.geometry && c.geometry.type === 'TorusGeometry').length;
      const orbs = scene.children.filter(c => c.geometry && c.geometry.type === 'SphereGeometry' && c.geometry.parameters && c.geometry.parameters.radius === 1.15).length;
      const best = firingFrames.length ? Math.max(...firingFrames) : -1;
      console.log('LASER_CHECK laserParented=' + parented + '/160 ringsInScene=' + rings + '/50 orbsInScene=' + orbs + '/12');
      console.log('LASER_CHECK activeWhileFiring=' + active);
      console.log('LASER_CHECK whiteBaseline=' + baseline + ' whiteFiringBest=' + best + ' delta=' + (best - baseline));
      console.log('LASER_CHECK ' + (parented === 160 && rings === 50 && best > baseline ? 'PASS' : 'FAIL'));
    }, 2500);
  }, 400);
});
</script>
</body>
</html>
